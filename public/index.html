<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TorqueBase</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23e6e6e6%22/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">TORQUEBASE <span>asset management</span></div>
    <nav id="nav">
      <a href="#/dashboard">Dashboard</a>
      <a href="#/students">Students</a>
      <a href="#/vehicles">Vehicles</a>
      <a href="#/assets">Assets</a>
      <a href="#/maintenance">Maintenance</a>
      <a href="#/inventory">Inventory</a>
    </nav>
  </header>

  <main id="view"></main>

  <!-- Reusable modal form -->
  <div id="modal" class="modal hidden">
    <form id="modalForm" class="modal-box" novalidate>
      <h3 id="modalTitle"></h3>
      <div id="modalFields" class="fields"></div>
      <div class="row end">
        <button type="button" class="ghost" id="modalCancel">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="rules.js"></script>
  <script src="app.js"></script>
</body>
</html>
